plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dashdrift.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dashdrift.game'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.4'
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
}
